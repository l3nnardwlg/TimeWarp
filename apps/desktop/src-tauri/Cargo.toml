[package]
name = "timewarp-desktop"
version = "0.1.0"
description = "TimeWarp local-first development timeline"
authors = ["TimeWarp contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "timewarp_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2" }
