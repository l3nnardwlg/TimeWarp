name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-core:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - name: CLI smoke test
        shell: bash
        run: |
          mkdir -p smoke
          printf 'hello\n' > smoke/file.txt
          node packages/cli/dist/cli.js init smoke --json
          node packages/cli/dist/cli.js status --project smoke --json
          node packages/cli/dist/cli.js doctor --project smoke --json

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm audit --audit-level high
